
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdf-tool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kdf_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
